name: Build one-click apps

# Builds the double-click apps in the cloud (no Mac/PC needed locally) and
# publishes them on the Releases page:
#   - Windows : FaceMorph-Windows.exe
#   - macOS   : FaceMorph-macOS-AppleSilicon.zip  /  FaceMorph-macOS-Intel.zip
# Runs on every push that touches the app, and can be started by hand from the
# Actions tab (Run workflow).

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'FaceMorph.py'
      - 'morph_onnx.py'
      - '*.onnx'
      - 'assets/**'
      - '.github/workflows/build-apps.yml'

permissions:
  contents: write          # needed to publish the Release

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            asset: FaceMorph-Windows.exe
          - os: macos-13            # Intel Macs
            name: macOS-Intel
            asset: FaceMorph-macOS-Intel.zip
          - os: macos-14            # Apple Silicon (M1/M2/M3)
            name: macOS-AppleSilicon
            asset: FaceMorph-macOS-AppleSilicon.zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: pip install pyinstaller onnxruntime customtkinter pillow numpy

      - name: Build the .exe (Windows)
        if: runner.os == 'Windows'
        run: >
          pyinstaller --onefile --windowed --noconfirm --name FaceMorph
          --add-data "generator.onnx;."
          --add-data "discriminator.onnx;."
          --add-data "assets;assets"
          --collect-all customtkinter
          --collect-all onnxruntime
          FaceMorph.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item dist/FaceMorph.exe ${{ matrix.asset }}

      - name: Build the .app (macOS)
        if: runner.os == 'macOS'
        run: >
          pyinstaller --windowed --noconfirm --name FaceMorph
          --add-data "generator.onnx:."
          --add-data "discriminator.onnx:."
          --add-data "assets:assets"
          --collect-all customtkinter
          --collect-all onnxruntime
          FaceMorph.py

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/FaceMorph.app" "${{ matrix.asset }}"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    name: Publish to Releases
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Collect builds
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish / update the "apps" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apps
          name: One-click apps (latest)
          body: |
            Download, then run. No Python, nothing to install.

            - **Windows:** `FaceMorph-Windows.exe` — double-click. If a blue SmartScreen box
              appears, click *More info -> Run anyway* (it is our own unsigned app).
            - **macOS, Apple Silicon (M1/M2/M3):** `FaceMorph-macOS-AppleSilicon.zip`
            - **macOS, Intel:** `FaceMorph-macOS-Intel.zip`

            On macOS: unzip, then **right-click `FaceMorph.app` -> Open** the first time (the app is
            unsigned, so a plain double-click is blocked). If macOS says it is "damaged", run once in
            Terminal: `xattr -cr /path/to/FaceMorph.app`
          files: artifacts/**
